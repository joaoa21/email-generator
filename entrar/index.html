<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Email Generator</title>
<meta name="description" content="Entre na sua conta do Email Generator.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f1ea">
<meta name="color-scheme" content="light">
<link rel="canonical" href="https://emailgenerator.com.br/entrar/">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/auth.css">
<script src="/assets/auth.js" defer></script>
<script src="/assets/conta.js" defer></script>
</head>
<body class="auth-page" data-page="entrar">
  <main class="auth-card">
    <a href="/" class="auth-brand"><span class="auth-mark" aria-hidden="true">e.</span><span>Email Generator</span></a>
    <h1 class="auth-title" id="authTitle">Entrar</h1>
    <p class="auth-sub" id="authSub">Use seu e-mail e senha para abrir o gerador.</p>

    <form class="auth-form" id="loginForm" novalidate>
        <div class="auth-field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required inputmode="email" maxlength="254">
        </div>
        <div class="auth-field">
          <label for="password">Senha</label>
          <div class="auth-input-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required maxlength="128">
            <button type="button" class="auth-show" aria-pressed="false" aria-label="Mostrar senha">Mostrar</button>
          </div>
        </div>
        <p class="auth-alert" id="loginAlert" role="alert" hidden></p>
        <button type="button" class="auth-link" id="resendBtn" hidden>Reenviar e-mail de confirmação</button>
        <button type="submit" class="auth-btn auth-btn-primary">Entrar</button>
        <div class="auth-row"><button type="button" class="auth-link" id="forgotBtn">Esqueci minha senha</button></div>
    </form>

    <form class="auth-form" id="forgotForm" novalidate hidden>
        <div class="auth-field">
          <label for="forgotEmail">E-mail da conta</label>
          <input type="email" id="forgotEmail" name="forgotEmail" autocomplete="email" required inputmode="email" maxlength="254">
        </div>
        <p class="auth-alert" id="forgotAlert" role="status" hidden></p>
        <button type="submit" class="auth-btn auth-btn-primary">Enviar link</button>
        <div class="auth-row"><button type="button" class="auth-link" id="forgotBack">Voltar para entrar</button></div>
    </form>

    <p class="auth-foot">Ainda não tem conta? <a href="/criar-conta/" id="signupLink">Criar conta</a></p>
  </main>
</body>
</html>
