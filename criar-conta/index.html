<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta | Email Generator</title>
<meta name="description" content="Crie sua conta para usar o gerador de e-mail HTML e o gerador de link de WhatsApp.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f1ea">
<meta name="color-scheme" content="light">
<link rel="canonical" href="https://emailgenerator.com.br/criar-conta/">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/auth.css">
<script src="/assets/auth.js" defer></script>
<script src="/assets/conta.js" defer></script>
</head>
<body class="auth-page" data-page="criar-conta">
  <main class="auth-card">
    <a href="/" class="auth-brand"><span class="auth-mark" aria-hidden="true">e.</span><span>Email Generator</span></a>
    <h1 class="auth-title" id="authTitle">Criar conta</h1>
    <p class="auth-sub" id="authSub">Leva um minuto. Depois é só confirmar o e&#8209;mail.</p>

    <form class="auth-form" id="signupForm" novalidate>
        <div class="auth-field">
          <label for="name">Nome</label>
          <input type="text" id="name" name="name" autocomplete="name" required maxlength="80">
        </div>
        <div class="auth-field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required inputmode="email" maxlength="254">
        </div>
        <div class="auth-field">
          <label for="password">Senha</label>
          <div class="auth-input-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" required maxlength="128">
            <button type="button" class="auth-show" aria-pressed="false" aria-label="Mostrar senha">Mostrar</button>
          </div>
          <ul class="auth-rules" id="rules" aria-label="Requisitos da senha"></ul>
        </div>
        <div class="auth-field">
          <label for="password2">Repita a senha</label>
          <div class="auth-input-wrap">
            <input type="password" id="password2" name="password2" autocomplete="new-password" required maxlength="128">
            <button type="button" class="auth-show" aria-pressed="false" aria-label="Mostrar senha">Mostrar</button>
          </div>
        </div>
        <label class="auth-check"><input type="checkbox" id="marketing">Quero receber novidades do Email Generator por e-mail (opcional).</label>
        <p class="auth-alert" id="signupAlert" role="alert" hidden></p>
        <button type="submit" class="auth-btn auth-btn-primary">Criar conta</button>
    </form>

    <div class="auth-done" id="signupDone" hidden>
      <p class="auth-sub">Enviamos um link de confirmação para <strong id="sentTo"></strong>. Abra o e-mail e clique no link para ativar a conta. Se não chegar em alguns minutos, confira o spam.</p>
      <p class="auth-alert" id="doneAlert" role="status" hidden></p>
      <button type="button" class="auth-btn" id="resendBtn">Reenviar e-mail</button>
    </div>

    <p class="auth-foot">Já tem conta? <a href="/entrar/" id="loginLink">Entrar</a></p>
  </main>
</body>
</html>
